name: 编译 APK · Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release tag（默认取 versionName，如 1.0）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 版本号自动 bump（push 时当前版本已有 Release 则补丁号+1）
        # 小修复自动区分：3.0.1 已有 Release → 自动 bump 为 3.0.2（versionCode+1）
        # 避免小修复永远无法发版；workflow_dispatch 手动发版不 bump（用输入 release_tag 控制）
        if: github.event_name == 'push'
        run: |
          VER=$(awk -F'"' '/versionName/{print $2; exit}' app/build.gradle.kts)
          CODE=$(awk '/versionCode = /{print $3; exit}' app/build.gradle.kts)
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "版本 $VER 已有 Release，自动 bump 补丁号"
            # 标准补丁号递增：3.0.1 → 3.0.2；3.0.9 → 3.0.10
            NEW_VER=$(echo "$VER" | awk -F. '{ if (NF>=3) { $3=$3+1; print $1"."$2"."$3 } else { print $0".1" } }')
            NEW_CODE=$((CODE + 1))
            sed -i "s/versionCode = $CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
            sed -i "s/versionName = \"$VER\"/versionName = \"$NEW_VER\"/" app/build.gradle.kts
            echo "bumped: $VER → $NEW_VER (versionCode $CODE → $NEW_CODE)"
            # 提交版本号推进，避免下次 push 重复 bump
            git config user.name "Auto Version Bot"
            git config user.email "bot@rikkahub-agents.local"
            git add app/build.gradle.kts
            git commit -m "chore: 自动 bump 版本号 $VER → $NEW_VER（versionCode $NEW_CODE）"
            git push origin main
          else
            echo "版本 $VER 无 Release，保持原版本"
          fi

      - name: 固定签名构建 Release (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/reasonix.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Rename Release APKs（带版本号）
        run: |
          cd app/build/outputs/apk/release
          # release 目录回 repo 根：../../../../../（release→apk→outputs→build→app→根）
          VER=$(awk -F'"' '/versionName/{print $2; exit}' ../../../../../app/build.gradle.kts || echo 0.0)
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk Reasonix-Agents-${VER}-arm64-v8a-release.apk || true
          [ -f app-universal-release.apk ] && mv app-universal-release.apk Reasonix-Agents-${VER}-universal-release.apk || true
          echo "版本号: ${VER}"

      - name: Upload Release APK
        # 先保产物：发版（下一步）失败也不丢 APK；artifact 永远存在供下载实测
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix-Agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: 创建/更新 Release（push 自动发版 + workflow_dispatch 手动发版）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 动态读取 versionName 作为默认 tag，可用 workflow_dispatch 的 release_tag 覆盖
          DEFAULT_TAG=$(awk -F'"' '/versionName/{print $2; exit}' app/build.gradle.kts)
          TAG="${RELEASE_TAG:-$DEFAULT_TAG}"
          echo "Release TAG: $TAG"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # push 自动发版：Release 已存在则跳过（避免每 push 都重建同名 Release）
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，push 自动发版跳过（如需更新请手动 workflow_dispatch）"
              exit 0
            fi
          fi
          # Release 不存在则创建，已存在则跳过创建
          # notes 自动生成：git log 变更摘要（无需后补描述）
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "🚀 Reasonix Agents $TAG" \
            --notes "$(git log --oneline --no-merges $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD 2>/dev/null | head -40 | sed 's/^/- /' || echo '## ✨ v$TAG\n\n### 📦 安装包\n- arm64-v8a 固定签名版\n- universal 全架构版')" || true
          # 上传 APK 到 Release
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            gh release upload "$TAG" "$apk" --clobber
            echo "Uploaded $apk"
          done

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            **/build/reports/

      - name: Telegram 构建通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MSG="${EMOJI} Reasonix Agents 构建 ${STATUS}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}
          ${URL}" || true
