name: 编译 APK · Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release tag（默认取 versionName，如 1.0）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 固定签名构建 Release (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/reasonix.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Rename Release APKs（带版本号）
        run: |
          cd app/build/outputs/apk/release
          # release 目录回 repo 根：../../../../../（release→apk→outputs→build→app→根）
          VER=$(grep 'versionName' ../../../../../app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo 0.0)
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk Reasonix-Agents-${VER}-arm64-v8a-release.apk || true
          [ -f app-universal-release.apk ] && mv app-universal-release.apk Reasonix-Agents-${VER}-universal-release.apk || true
          echo "版本号: ${VER}"

      - name: 创建/更新 Release（仅 workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 动态读取 versionName 作为默认 tag，可用 workflow_dispatch 的 release_tag 覆盖
          DEFAULT_TAG=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${RELEASE_TAG:-$DEFAULT_TAG}"
          echo "Release TAG: $TAG"
          # Release 不存在则创建，已存在则跳过创建
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "🚀 Reasonix Android $TAG" \
            --notes "## ✨ v$TAG

            ### 📦 安装包
            - \`Reasonix-Agents-arm64-v8a-release.apk\`（arm64-v8a 固定签名版）
            - \`Reasonix-Agents-universal-release.apk\`（universal 全架构版）

            ### 🔐 连接配置
            - 协议：HTTP / HTTPS（HTTPS 默认端口 443）
            - 认证：用户名/密码（Basic Auth，可选）
            - 服务器：Reasonix 后端（DeepSeek-Reasonix 协议）

            ### 🆕 更新内容
            - 🔐 支持 Basic Auth 认证连接
            - 🌐 支持 HTTP/HTTPS 协议切换
            - 📱 Android 原生客户端（Kotlin + Compose）" || true
          # 上传 APK 到 Release
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            gh release upload "$TAG" "$apk" --clobber
            echo "Uploaded $apk"
          done

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix-Agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            **/build/reports/

      - name: Telegram 构建通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MSG="${EMOJI} Reasonix Agents 构建 ${STATUS}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}
          ${URL}" || true
