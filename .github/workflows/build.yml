name: 编译 APK · Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      nothing:
        description: '手动触发编译（不发版；发版走 release.yml 工作流，版本号由发版输入控制）'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle & Android SDK（依赖缓存 key 指纹化 + 构建缓存固定 key 防堆积）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            ~/.android/caches
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-
      - name: Cache Kotlin/Gradle build cache（固定 key，防止每构建存全量快照）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 版本号检查（只读提示，不自动 bump 不发版）
        # 2026-08-13：只读——自动 bump 会 push 触发循环构建；发版走 release.yml 工作流
        if: github.event_name == 'push'
        run: |
          VER=$(awk -F'"' '/versionName/{print $2; exit}' app/build.gradle.kts)
          echo "当前版本: $VER（构建产物用此版本号命名）"

      - name: 固定签名构建 Release (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/reasonix.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          ./gradlew assembleRelease --stacktrace

      - name: 编译单元测试（验证测试代码可编译，不执行）
        run: |
          ./gradlew compileDebugUnitTestKotlin --parallel --configure-on-demand || true

      - name: Rename Release APKs（带版本号）
        run: |
          cd app/build/outputs/apk/release
          # release 目录回 repo 根：../../../../../（release→apk→outputs→build→app→根）
          VER=$(awk -F'"' '/versionName/{print $2; exit}' ../../../../../app/build.gradle.kts || echo 0.0)
          [ -f app-arm64-v8a-release.apk ] && mv app-arm64-v8a-release.apk Reasonix-Agents-${VER}-arm64-v8a-release.apk || true
          [ -f app-universal-release.apk ] && mv app-universal-release.apk Reasonix-Agents-${VER}-universal-release.apk || true
          echo "版本号: ${VER}"

      - name: Upload Release APK
        # 先保产物：发版（下一步）失败也不丢 APK；artifact 永远存在供下载实测
        uses: actions/upload-artifact@v4
        with:
          name: Reasonix-Agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            **/build/reports/

      - name: Telegram 构建通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MSG="${EMOJI} Reasonix Agents 构建 ${STATUS}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}
          ${URL}" || true

      - name: 构建失败通知（Server）
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "未配置 SERVERCHAN_KEY，跳过通知"
            exit 0
          fi
          MSG="Reasonix Agents 构建失败 #${{ github.run_number }}"
          DESP="commit: ${{ github.sha }}%0A%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=${MSG}" -d "desp=${DESP}" | head -c 200
          echo
